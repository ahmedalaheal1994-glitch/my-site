<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>موقعي الشخصي</title>
  <style>
    body {
      margin: 0;
      font-family: "Cairo", sans-serif;
      background: linear-gradient(135deg, #007bff, #00d4ff);
      color: white;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
    }
    h1 {
      font-size: 3em;
      margin-bottom: 10px;
    }
    p {
      font-size: 1.2em;
      margin-bottom: 30px;
    }
    a {
      background: white;
      color: #007bff;
      text-decoration: none;
      padding: 12px 25px;
      border-radius: 25px;
      font-weight: bold;
      transition: 0.3s;
    }
    a:hover {
      background: #f1f1f1;
    }
    footer {
      position: absolute;
      bottom: 15px;
      font-size: 0.9em;
      color: rgba(255,255,255,0.7);
    }
  </style>
</head>
<body>
  <h1>مرحباً بك في موقعي ✨</h1>
  <p>تم تصميم هذا الموقع باستخدام GitHub Pages 🚀</p>
  <a href="https://github.com/ahmedalaheal1994-glitch" target="_blank">زرني على GitHub</a>

  <footer>© 2025 جميع الحقوق محفوظة</footer>
</body>
</html>
